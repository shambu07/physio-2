# =========================
# Core
# =========================
spring.application.name=physio-clinic
server.port=9092

# =========================
# Actuator (runs on 9093)
# =========================
management.server.port=9093
management.server.address=127.0.0.1
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,mappings,beans,conditions,loggers,logfile,env,configprops,httpexchanges
management.endpoint.health.show-details=always
management.endpoint.logfile.enabled=true

# =========================
# Logging (capture stack traces)
# =========================
logging.file.name=logs/physio.log
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web.servlet.handler=DEBUG
logging.level.org.springframework.web.method=DEBUG
logging.level.org.springframework.boot.actuate.endpoint.web.mappings=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.jdbc=INFO

# =========================
# Swagger / OpenAPI
# =========================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# =========================
# JWT (shared)
# =========================
app.jwt.secret=toXhyLxvdxQQ09vnOvF8gCfSkoympSuY4wM8dSHytQk=
# 24h in ms
app.jwt.expiration=86400000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3310/physioclinic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpass

