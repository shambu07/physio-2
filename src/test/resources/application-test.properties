# --- H2 in-memory DB, MySQL compatibility ---
spring.datasource.url=jdbc:h2:mem:physio;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create/drop tables for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during tests to avoid MySQL-specific SQL errors
spring.flyway.enabled=false

# Silence actuator hits in tests
management.endpoints.enabled-by-default=false

# JWT bits so context builds
jwt.secret=TEST_SECRET_FOR_CI_ONLY
jwt.expMinutes=5
