# .github/workflows/maven.yml
name: Maven CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & test (H2 profile, no Flyway)
        run: mvn -B clean verify "-Dspring.profiles.active=test" "-Dflyway.enabled=false"
